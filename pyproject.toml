[project]
name = "issuepilot"
version = "0.1.0"
description = "Local GitHub issue-to-patch agent for Python/FastAPI repositories."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "openai>=3.27.0",
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "httpx>=0.28.1",
]

[project.scripts]
issuepilot = "issuepilot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/issuepilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/issuepilot/evals/bench.py" = ["E501"]  # fixture source embedded as strings

[tool.mypy]
strict = true
mypy_path = "src"
